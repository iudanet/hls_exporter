# golangci-lint v2. Версия линтера закреплена в .github/workflows/go.yml —
# обновлять её и этот конфиг вместе.
version: "2"

linters:
  # standard: errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  enable:
    - bodyclose
    - gosec
    - misspell
    - noctx
    - unconvert

formatters:
  enable:
    - gofmt
    - goimports
